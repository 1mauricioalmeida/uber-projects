name: Deploy passenger experience to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'passenger-experience/site/**'
      - '.github/workflows/deploy-passenger-experience.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload passenger site
        uses: actions/upload-pages-artifact@v4
        with:
          path: passenger-experience/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
