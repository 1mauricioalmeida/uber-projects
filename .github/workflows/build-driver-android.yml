name: Build driver Android MVP

on:
  pull_request:
    paths:
      - 'driver-dashboard/android/**'
      - '.github/workflows/build-driver-android.yml'
  push:
    branches: [main]
    paths:
      - 'driver-dashboard/android/**'
      - '.github/workflows/build-driver-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver-dashboard/android
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hospitalidade-driver-debug
          path: driver-dashboard/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
